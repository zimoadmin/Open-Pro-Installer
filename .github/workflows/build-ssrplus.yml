name: Build SSR Plus+

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file

      - name: Download OpenWrt source
        run: |
          git clone --depth=1 \
            -b openwrt-21.02 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      - name: Add SSR Plus+
        working-directory: openwrt
        run: |
          rm -rf package/helloworld

          git clone --depth=1 \
            https://github.com/fw876/helloworld.git \
            package/helloworld

      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        working-directory: openwrt
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_generic=y

          CONFIG_PACKAGE_luci-app-ssr-plus=m
          CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=m

          CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=m
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=m

          CONFIG_PACKAGE_chinadns-ng=m
          CONFIG_PACKAGE_dns2socks=m
          CONFIG_PACKAGE_microsocks=m
          CONFIG_PACKAGE_tcping=m
          EOF

          make defconfig

      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8

      - name: Build SSR Plus+
        working-directory: openwrt
        run: |
          make package/helloworld/luci-app-ssr-plus/compile \
            -j1 V=s

      - name: Collect IPK packages
        run: |
          mkdir -p output

          find openwrt/bin/packages \
            openwrt/bin/targets \
            -type f \
            -name "*.ipk" \
            -exec cp -v {} output/ \; || true

          echo "Generated packages:"
          ls -lh output || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssrplus-aarch64
          path: output/*.ipk
          if-no-files-found: error
