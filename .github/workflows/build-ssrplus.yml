name: Build SSR Plus+ for GL.iNet

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file \
            jq

      - name: Clone GL.iNet OpenWrt SDK
        run: |
          git clone --depth=1 \
            https://github.com/gl-inet-builder/openwrt-sdk-mt7981.git \
            sdk

      - name: Show SDK information
        working-directory: sdk
        run: |
          echo "===== SDK INFO ====="

          uname -a

          echo ""
          echo "Feeds:"
          cat feeds.conf.default || true

          echo ""
          echo "SDK files:"
          ls -la

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add SSR Plus+
        working-directory: sdk
        run: |
          rm -rf package/helloworld

          git clone --depth=1 \
            https://github.com/fw876/helloworld.git \
            package/helloworld

      - name: Upgrade Go feed for OpenWrt 21.02
        working-directory: sdk
        run: |
          rm -rf feeds/packages/lang/golang

          git clone \
            --depth=1 \
            https://github.com/sbwml/packages_lang_golang \
            feeds/packages/lang/golang

      - name: Refresh package indexes
        working-directory: sdk
        run: |
          ./scripts/feeds install -a

      - name: Configure SSR Plus+
        working-directory: sdk
        run: |
          cat >> .config <<'EOF'

          CONFIG_PACKAGE_luci-app-ssr-plus=m
          CONFIG_PACKAGE_luci-i18n-ssr-plus-zh-cn=m

          CONFIG_PACKAGE_shadowsocksr-libev-ssr-local=m
          CONFIG_PACKAGE_shadowsocksr-libev-ssr-redir=m

          CONFIG_PACKAGE_chinadns-ng=m
          CONFIG_PACKAGE_dns2socks=m
          CONFIG_PACKAGE_microsocks=m
          CONFIG_PACKAGE_tcping=m
          EOF

          make defconfig

      - name: Download sources
        working-directory: sdk
        run: |
          make download -j8 || make download -j1 V=s

      - name: Build dependencies
        working-directory: sdk
        run: |
          make package/helloworld/shadowsocksr-libev/compile \
            -j1 V=s || true

          make package/helloworld/chinadns-ng/compile \
            -j1 V=s || true

          make package/helloworld/dns2socks/compile \
            -j1 V=s || true

          make package/helloworld/microsocks/compile \
            -j1 V=s || true

          make package/helloworld/tcping/compile \
            -j1 V=s || true

      - name: Build SSR Plus+
        working-directory: sdk
        run: |
          make package/helloworld/luci-app-ssr-plus/compile \
            -j1 V=s

      - name: Collect IPK packages
        run: |
          mkdir -p output

          find sdk/bin \
            -type f \
            -name "*.ipk" \
            -print \
            -exec cp -v {} output/ \;

          echo ""
          echo "===== GENERATED PACKAGES ====="

          ls -lh output

      - name: Create package list
        run: |
          cd output

          {
            echo "{"
            echo '  "arch": "aarch64_cortex-a53",'
            echo '  "source": "gl-inet-builder/openwrt-sdk-mt7981",'
            echo '  "packages": ['

            FIRST=1

            for file in *.ipk; do
              [ -f "$file" ] || continue

              if [ "$FIRST" = "0" ]; then
                echo ","
              fi

              printf '    "%s"' "$file"

              FIRST=0
            done

            echo ""
            echo "  ]"
            echo "}"

          } > packages.json

          cat packages.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ssrplus-glinet-aarch64_cortex-a53
          path: |
            output/*.ipk
            output/packages.json
          if-no-files-found: error
