name: Build MosDNS for OpenWrt 21.02

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      TZ: Asia/Shanghai

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. Build dependencies
      # ======================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file \
            jq \
            curl \
            patch \
            perl \
            subversion \
            time


      # ======================================================
      # 3. Clone GL.iNet SDK
      # ======================================================

      - name: Clone GL.iNet OpenWrt SDK
        run: |
          echo "======================================"
          echo "Clone GL.iNet SDK"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/gl-inet-builder/openwrt-sdk-mt7981.git \
            sdk


      # ======================================================
      # 4. SDK information
      # ======================================================

      - name: Show SDK information
        working-directory: sdk
        run: |
          echo "======================================"
          echo "SDK Information"
          echo "======================================"

          echo
          echo "Directory:"
          pwd

          echo
          echo "feeds.conf.default:"
          cat feeds.conf.default 2>/dev/null || true

          echo
          echo ".config target:"
          grep -E \
            'CONFIG_TARGET_|CONFIG_ARCH_PACKAGES|CONFIG_TARGET_ARCH_PACKAGES' \
            .config 2>/dev/null || true


      # ======================================================
      # 5. Fix broken MediaTek feed
      #
      # SDK 原配置可能包含：
      #
      # ^df3fc79
      #
      # 这个固定 commit 已失效。
      # 这里直接重写 MTK feed。
      # ======================================================

      - name: Fix MediaTek feed
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Fix MediaTek feed"
          echo "======================================"

          cp feeds.conf.default feeds.conf.default.bak

          echo
          echo "Before:"
          grep -n 'mtk_openwrt_feed' \
            feeds.conf.default || true

          # 删除旧的 mtk feed
          sed -i \
            '/^[[:space:]]*src-git.*mtk_openwrt_feed[[:space:]]/d' \
            feeds.conf.default

          # 添加新的 MTK feed
          echo \
            'src-git mtk_openwrt_feed https://git01.mediatek.com/openwrt/feeds/mtk-openwrt-feeds' \
            >> feeds.conf.default

          echo
          echo "After:"
          grep -n 'mtk_openwrt_feed' \
            feeds.conf.default || true

          echo
          echo "Full feeds.conf.default:"
          cat feeds.conf.default


      # ======================================================
      # 6. Update feeds
      # ======================================================

      - name: Update feeds
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Update feeds"
          echo "======================================"

          ./scripts/feeds update -a


      # ======================================================
      # 7. Install feeds
      # ======================================================

      - name: Install feeds
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Install feeds"
          echo "======================================"

          ./scripts/feeds install -a


      # ======================================================
      # 8. Replace Golang feed
      #
      # MosDNS v5 需要新版 Go。
      # ======================================================

      - name: Replace Golang feed
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Replace Golang feed"
          echo "======================================"

          rm -rf feeds/packages/lang/golang

          git clone \
            --depth=1 \
            -b 26.x \
            https://github.com/sbwml/packages_lang_golang.git \
            feeds/packages/lang/golang

          echo
          echo "Golang feed ready."


      # ======================================================
      # 9. Remove conflicting packages
      #
      # Non-official OpenWrt source:
      # remove existing mosdns / v2ray-geodata definitions
      # ======================================================

      - name: Remove conflicting MosDNS packages
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Remove conflicting packages"
          echo "======================================"

          find . \
            -type f \
            -name Makefile \
            -path '*mosdns*' \
            -print \
            -delete \
            2>/dev/null || true

          find . \
            -type f \
            -name Makefile \
            -path '*v2ray-geodata*' \
            -print \
            -delete \
            2>/dev/null || true

          rm -rf package/mosdns
          rm -rf package/v2ray-geodata


      # ======================================================
      # 10. Clone MosDNS
      # ======================================================

      - name: Clone luci-app-mosdns
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Clone luci-app-mosdns"
          echo "======================================"

          git clone \
            --depth=1 \
            -b v5 \
            https://github.com/sbwml/luci-app-mosdns.git \
            package/mosdns


      # ======================================================
      # 11. Clone v2ray-geodata
      # ======================================================

      - name: Clone v2ray-geodata
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Clone v2ray-geodata"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/sbwml/v2ray-geodata.git \
            package/v2ray-geodata


      # ======================================================
      # 12. Refresh package metadata
      # ======================================================

      - name: Refresh feeds package metadata
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Refresh package metadata"
          echo "======================================"

          ./scripts/feeds install -a


      # ======================================================
      # 13. Check package definitions
      # ======================================================

      - name: Check MosDNS package files
        working-directory: sdk
        run: |
          echo "======================================"
          echo "MosDNS files"
          echo "======================================"

          find package/mosdns \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 150

          echo
          echo "======================================"
          echo "MosDNS Makefiles"
          echo "======================================"

          find package/mosdns \
            -name Makefile \
            -type f \
            -print

          echo
          echo "======================================"
          echo "v2ray-geodata files"
          echo "======================================"

          find package/v2ray-geodata \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -n 100


      # ======================================================
      # 14. Configure MosDNS packages
      # ======================================================

      - name: Configure packages
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Configure MosDNS"
          echo "======================================"

          cat >> .config <<'EOF'

          CONFIG_PACKAGE_mosdns=m
          CONFIG_PACKAGE_luci-app-mosdns=m
          CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m
          CONFIG_PACKAGE_v2dat=m
          CONFIG_PACKAGE_v2ray-geoip=m
          CONFIG_PACKAGE_v2ray-geosite=m

          EOF

          make defconfig

          echo
          echo "Selected MosDNS packages:"
          grep -E \
            'CONFIG_PACKAGE_(mosdns|luci-app-mosdns|luci-i18n-mosdns|v2dat|v2ray-geo)' \
            .config || true


      # ======================================================
      # 15. Download sources
      # ======================================================

      - name: Download MosDNS sources
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Download MosDNS sources"
          echo "======================================"

          make \
            package/mosdns/download \
            -j1 \
            V=s || true

          make \
            package/v2ray-geodata/download \
            -j1 \
            V=s || true


      # ======================================================
      # 16. Compile tools / host dependencies first
      #
      # 让旧 SDK 先把必要的 host 工具准备好，
      # 后续报错会更清楚。
      # ======================================================

      - name: Build host tools
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Build host tools"
          echo "======================================"

          make \
            tools/install \
            -j"$(nproc)" \
            V=s || \
          make \
            tools/install \
            -j1 \
            V=s

          make \
            toolchain/install \
            -j"$(nproc)" \
            V=s || \
          make \
            toolchain/install \
            -j1 \
            V=s


      # ======================================================
      # 17. Compile MosDNS
      # ======================================================

      - name: Compile MosDNS
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Compile MosDNS"
          echo "======================================"

          set +e

          make \
            package/mosdns/luci-app-mosdns/compile \
            -j"$(nproc)" \
            V=s

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then

            echo
            echo "======================================"
            echo "Parallel build failed"
            echo "Retry with -j1 V=s"
            echo "======================================"
            echo

            make \
              package/mosdns/luci-app-mosdns/compile \
              -j1 \
              V=s

          fi


      # ======================================================
      # 18. Compile v2ray-geodata
      # ======================================================

      - name: Compile v2ray-geodata
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Compile v2ray-geodata"
          echo "======================================"

          set +e

          make \
            package/v2ray-geodata/compile \
            -j"$(nproc)" \
            V=s

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then

            echo
            echo "======================================"
            echo "Retry v2ray-geodata with -j1"
            echo "======================================"

            make \
              package/v2ray-geodata/compile \
              -j1 \
              V=s

          fi


      # ======================================================
      # 19. Search generated packages
      # ======================================================

      - name: Collect packages
        run: |
          echo "======================================"
          echo "Collect IPK packages"
          echo "======================================"

          mkdir -p output

          find sdk/bin \
            -type f \
            -name '*.ipk' \
            \( \
              -name '*mosdns*' \
              -o \
              -name '*v2dat*' \
              -o \
              -name '*v2ray-geoip*' \
              -o \
              -name '*v2ray-geosite*' \
            \) \
            -print \
            -exec cp -f {} output/ \;

          echo
          echo "======================================"
          echo "Output"
          echo "======================================"

          ls -lah output || true


      # ======================================================
      # 20. Verify output
      # ======================================================

      - name: Verify packages
        run: |
          echo "======================================"
          echo "Verify build result"
          echo "======================================"

          COUNT="$(
            find output \
              -maxdepth 1 \
              -type f \
              -name '*.ipk' \
              | wc -l
          )"

          echo "IPK count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo
            echo "[ERROR] No MosDNS IPK packages generated"
            exit 1
          fi

          echo
          echo "[OK] Build packages found"


      # ======================================================
      # 21. Create package list
      # ======================================================

      - name: Create build info
        run: |
          {
            echo "Open-Pro-Installer"
            echo "MosDNS OpenWrt 21.02"
            echo
            echo "Build time:"
            date
            echo
            echo "Packages:"
            ls -1 output
          } > output/BUILD_INFO.txt


      # ======================================================
      # 22. Upload artifact
      # ======================================================

      - name: Upload MosDNS packages
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-openwrt-21.02-aarch64_cortex-a53
          path: output/*
          if-no-files-found: error
          retention-days: 30
