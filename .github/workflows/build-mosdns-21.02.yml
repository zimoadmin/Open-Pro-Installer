name: Build MosDNS for GL-MT3600BE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. Install dependencies
      # ======================================================
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            curl \
            file \
            jq \
            zlib1g-dev

      # ======================================================
      # 3. Clone GL.iNet MT7981 SDK
      # ======================================================
      - name: Clone GL.iNet SDK
        run: |
          echo "======================================"
          echo "Clone GL.iNet MT7981 SDK"
          echo "======================================"

          git clone \
            --depth=1 \
            https://github.com/gl-inet-builder/openwrt-sdk-mt7981.git \
            sdk

          cd sdk

          echo
          echo "SDK:"
          git log -1 --oneline || true

      # ======================================================
      # 4. Fix feeds.conf
      #
      # 重点：
      # MTK feed 在 GL.iNet SDK 中可能带固定 commit。
      # MosDNS 编译不需要主动更新 MTK feed。
      # ======================================================
      - name: Prepare feeds
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Original feeds"
          echo "======================================"

          cat feeds.conf.default || true

          echo
          echo "======================================"
          echo "Disable problematic MTK feed"
          echo "======================================"

          # 注释 MTK 私有 feed
          sed -i \
            '/mtk[_-]openwrt[_-]feed/s/^/# DISABLED_FOR_MOSDNS /' \
            feeds.conf.default || true

          echo
          echo "======================================"
          echo "MosDNS build feeds"
          echo "======================================"

          cat feeds.conf.default

      # ======================================================
      # 5. Update feeds
      # ======================================================
      - name: Update feeds
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Update feeds"
          echo "======================================"

          # 不再 update -a
          # 只更新 MosDNS 所需要的公开 feeds

          ./scripts/feeds update packages
          ./scripts/feeds update luci

          # routing 如果 SDK 有则更新
          if grep -q '^src-git.*routing' feeds.conf.default; then
            ./scripts/feeds update routing
          fi

          echo
          echo "======================================"
          echo "Available feeds"
          echo "======================================"

          ls -lah feeds/

      # ======================================================
      # 6. Install feeds
      # ======================================================
      - name: Install feeds
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Install feeds"
          echo "======================================"

          ./scripts/feeds install -a

      # ======================================================
      # 7. Replace Golang
      #
      # OpenWrt 21.02 自带 Golang 太旧，
      # MosDNS v5 需要较新的 Golang。
      # ======================================================
      - name: Replace Golang feed
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Replace Golang"
          echo "======================================"

          rm -rf feeds/packages/lang/golang
          rm -rf package/feeds/packages/golang

          git clone \
            --depth=1 \
            https://github.com/sbwml/packages_lang_golang \
            feeds/packages/lang/golang

          ./scripts/feeds install golang

          echo
          echo "Golang feed:"
          git -C feeds/packages/lang/golang log -1 --oneline || true

      # ======================================================
      # 8. Remove conflicting MosDNS
      # ======================================================
      - name: Remove conflicting MosDNS packages
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Remove old MosDNS packages"
          echo "======================================"

          rm -rf feeds/packages/net/mosdns
          rm -rf feeds/luci/applications/luci-app-mosdns

          rm -rf package/feeds/packages/mosdns
          rm -rf package/feeds/luci/luci-app-mosdns

          rm -rf package/mosdns
          rm -rf package/luci-app-mosdns

      # ======================================================
      # 9. Clone MosDNS v5
      # ======================================================
      - name: Clone MosDNS v5
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Clone luci-app-mosdns v5"
          echo "======================================"

          git clone \
            --depth=1 \
            -b v5 \
            https://github.com/sbwml/luci-app-mosdns.git \
            /tmp/luci-app-mosdns

          mkdir -p package/mosdns

          # MosDNS core
          cp -a \
            /tmp/luci-app-mosdns/mosdns \
            package/mosdns/

          # LuCI
          cp -a \
            /tmp/luci-app-mosdns/luci-app-mosdns \
            package/mosdns/

          echo
          echo "======================================"
          echo "MosDNS package tree"
          echo "======================================"

          find package/mosdns -maxdepth 2 -type f | head -100

      # ======================================================
      # 10. Check package definitions
      # ======================================================
      - name: Check MosDNS packages
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Check MosDNS"
          echo "======================================"

          test -f package/mosdns/mosdns/Makefile
          test -f package/mosdns/luci-app-mosdns/Makefile

          echo "[OK] mosdns Makefile"
          echo "[OK] luci-app-mosdns Makefile"

      # ======================================================
      # 11. Generate config
      # ======================================================
      - name: Generate build config
        working-directory: sdk
        run: |
          set -e

          echo "======================================"
          echo "Generate config"
          echo "======================================"

          # 先使用 SDK 默认配置
          if [ -f .config ]; then
            cp .config /tmp/sdk.config
          fi

          # 选择 MosDNS
          echo "CONFIG_PACKAGE_mosdns=m" >> .config
          echo "CONFIG_PACKAGE_luci-app-mosdns=m" >> .config

          make defconfig

          echo
          echo "======================================"
          echo "MosDNS config"
          echo "======================================"

          grep -E \
            'CONFIG_PACKAGE_(mosdns|luci-app-mosdns)' \
            .config || true

      # ======================================================
      # 12. Download source
      # ======================================================
      - name: Download MosDNS sources
        working-directory: sdk
        run: |
          echo "======================================"
          echo "Download sources"
          echo "======================================"

          make package/mosdns/mosdns/download \
            V=s \
            -j1 || true

          make package/mosdns/luci-app-mosdns/download \
            V=s \
            -j1 || true

      # ======================================================
      # 13. Build MosDNS core
      # ======================================================
      - name: Build MosDNS
        working-directory: sdk
        run: |
          set -o pipefail

          echo "======================================"
          echo "Build MosDNS Core"
          echo "======================================"

          make package/mosdns/mosdns/compile \
            V=s \
            -j$(nproc) \
            2>&1 | tee /tmp/mosdns-build.log

      # ======================================================
      # 14. Build LuCI
      # ======================================================
      - name: Build luci-app-mosdns
        working-directory: sdk
        run: |
          set -o pipefail

          echo "======================================"
          echo "Build luci-app-mosdns"
          echo "======================================"

          make package/mosdns/luci-app-mosdns/compile \
            V=s \
            -j$(nproc) \
            2>&1 | tee /tmp/luci-mosdns-build.log

      # ======================================================
      # 15. Collect packages
      # ======================================================
      - name: Collect packages
        if: always()
        run: |
          mkdir -p output

          echo "======================================"
          echo "Find MosDNS packages"
          echo "======================================"

          find sdk/bin/packages \
            -type f \
            \( \
              -name 'mosdns_*.ipk' \
              -o \
              -name 'luci-app-mosdns_*.ipk' \
            \) \
            -print \
            -exec cp -f {} output/ \; \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Output"
          echo "======================================"

          ls -lh output/ || true

      # ======================================================
      # 16. Verify
      # ======================================================
      - name: Verify packages
        run: |
          echo "======================================"
          echo "Verify build result"
          echo "======================================"

          MOSDNS="$(find output -maxdepth 1 -name 'mosdns_*.ipk' | head -1)"
          LUCI="$(find output -maxdepth 1 -name 'luci-app-mosdns_*.ipk' | head -1)"

          if [ -z "$MOSDNS" ]; then
            echo "[ERROR] mosdns IPK not found"
            exit 1
          fi

          if [ -z "$LUCI" ]; then
            echo "[ERROR] luci-app-mosdns IPK not found"
            exit 1
          fi

          echo
          echo "[OK] MosDNS:"
          ls -lh "$MOSDNS"

          echo
          echo "[OK] LuCI:"
          ls -lh "$LUCI"

          echo
          echo "======================================"
          echo "Build successful"
          echo "======================================"

      # ======================================================
      # 17. Upload
      # ======================================================
      - name: Upload MosDNS packages
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-gl-mt3600be
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30

      # ======================================================
      # 18. Upload logs when failed
      # ======================================================
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-build-logs
          path: |
            /tmp/mosdns-build.log
            /tmp/luci-mosdns-build.log
          if-no-files-found: ignore
          retention-days: 7
