name: Build MosDNS for OpenWrt 21.02

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. Install build dependencies
      # ======================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            rsync \
            unzip \
            wget \
            zlib1g-dev \
            file \
            jq \
            curl


      # ======================================================
      # 3. Download GL.iNet / OpenWrt 21.02 SDK
      #
      # 这里先使用你之前 MT7981/MT798x 使用的 SDK 仓库。
      # 如果你的设备 SDK 仓库不同，只改这里即可。
      # ======================================================

      - name: Clone OpenWrt SDK
        run: |
          git clone \
            --depth=1 \
            https://github.com/gl-inet-builder/openwrt-sdk-mt7981.git \
            sdk


      # ======================================================
      # 4. Show SDK info
      # ======================================================

      - name: Show SDK information
        working-directory: sdk
        run: |
          echo "======================================"
          echo "SDK Information"
          echo "======================================"

          pwd

          echo
          echo "feeds.conf:"
          cat feeds.conf.default 2>/dev/null || true

          echo
          echo "Target:"
          grep -E \
            'CONFIG_TARGET_|CONFIG_ARCH_PACKAGES' \
            .config 2>/dev/null || true


      # ======================================================
      # 5. Update feeds
      # ======================================================

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a


      # ======================================================
      # 6. Install feeds
      # ======================================================

      - name: Install feeds
        working-directory: sdk
        run: |
          ./scripts/feeds install -a


      # ======================================================
      # 7. Remove conflicting MosDNS packages
      #
      # 非 OpenWrt 官方源码，MosDNS 上游建议删除源码里已有的
      # mosdns / v2ray-geodata 定义，避免包冲突。
      # ======================================================

      - name: Remove conflicting packages
        working-directory: sdk
        run: |
          find . \
            -type f \
            -name Makefile \
            -path '*mosdns*' \
            -delete 2>/dev/null || true

          find . \
            -type f \
            -name Makefile \
            -path '*v2ray-geodata*' \
            -delete 2>/dev/null || true

          rm -rf package/mosdns
          rm -rf package/v2ray-geodata


      # ======================================================
      # 8. Clone MosDNS LuCI
      # ======================================================

      - name: Clone luci-app-mosdns
        working-directory: sdk
        run: |
          git clone \
            --depth=1 \
            -b v5 \
            https://github.com/sbwml/luci-app-mosdns.git \
            package/mosdns


      # ======================================================
      # 9. Clone v2ray-geodata
      # ======================================================

      - name: Clone v2ray-geodata
        working-directory: sdk
        run: |
          git clone \
            --depth=1 \
            https://github.com/sbwml/v2ray-geodata.git \
            package/v2ray-geodata


      # ======================================================
      # 10. Check MosDNS package definitions
      # ======================================================

      - name: Check package files
        working-directory: sdk
        run: |
          echo "======================================"
          echo "MosDNS files"
          echo "======================================"

          find package/mosdns \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -n 100

          echo
          echo "======================================"
          echo "v2ray-geodata files"
          echo "======================================"

          find package/v2ray-geodata \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -n 100


      # ======================================================
      # 11. Generate config
      #
      # 选择 MosDNS 及相关包
      # ======================================================

      - name: Configure packages
        working-directory: sdk
        run: |
          cat >> .config <<'EOF'

          CONFIG_PACKAGE_mosdns=m
          CONFIG_PACKAGE_luci-app-mosdns=m
          CONFIG_PACKAGE_luci-i18n-mosdns-zh-cn=m
          CONFIG_PACKAGE_v2ray-geoip=m
          CONFIG_PACKAGE_v2ray-geosite=m

          EOF

          make defconfig


      # ======================================================
      # 12. Download sources
      # ======================================================

      - name: Download package sources
        working-directory: sdk
        run: |
          make \
            package/mosdns/download \
            V=s \
            -j1 || true

          make \
            package/v2ray-geodata/download \
            V=s \
            -j1 || true


      # ======================================================
      # 13. Compile MosDNS
      #
      # 首次使用 -j$(nproc)
      # 失败后自动单线程 V=s 重试，方便看到详细错误。
      # ======================================================

      - name: Compile MosDNS
        working-directory: sdk
        run: |
          set +e

          make \
            package/mosdns/luci-app-mosdns/compile \
            -j"$(nproc)" \
            V=s

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then

            echo
            echo "======================================"
            echo "Parallel build failed"
            echo "Retry with -j1 V=s"
            echo "======================================"
            echo

            make \
              package/mosdns/luci-app-mosdns/compile \
              -j1 \
              V=s

          fi


      # ======================================================
      # 14. Compile geodata
      # ======================================================

      - name: Compile v2ray geodata
        working-directory: sdk
        run: |
          set +e

          make \
            package/v2ray-geodata/compile \
            -j"$(nproc)" \
            V=s

          RESULT=$?

          if [ "$RESULT" -ne 0 ]; then

            make \
              package/v2ray-geodata/compile \
              -j1 \
              V=s

          fi


      # ======================================================
      # 15. Find generated packages
      # ======================================================

      - name: Collect IPK packages
        run: |
          mkdir -p output

          find sdk/bin/packages \
            -type f \
            \( \
              -name '*mosdns*.ipk' \
              -o \
              -name '*v2ray-geoip*.ipk' \
              -o \
              -name '*v2ray-geosite*.ipk' \
            \) \
            -exec cp -f {} output/ \;

          find sdk/bin/targets \
            -type f \
            \( \
              -name '*mosdns*.ipk' \
              -o \
              -name '*v2ray-geoip*.ipk' \
              -o \
              -name '*v2ray-geosite*.ipk' \
            \) \
            -exec cp -f {} output/ \; \
            2>/dev/null || true

          echo
          echo "======================================"
          echo "Generated packages"
          echo "======================================"

          ls -lah output || true


      # ======================================================
      # 16. Verify packages exist
      # ======================================================

      - name: Verify build result
        run: |
          COUNT="$(
            find output \
              -maxdepth 1 \
              -type f \
              -name '*.ipk' \
              | wc -l
          )"

          echo "IPK count: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "[ERROR] No IPK packages generated"
            exit 1
          fi


      # ======================================================
      # 17. Upload Artifact
      # ======================================================

      - name: Upload MosDNS packages
        uses: actions/upload-artifact@v4
        with:
          name: mosdns-openwrt-21.02-aarch64_cortex-a53
          path: output/*
          if-no-files-found: error
          retention-days: 30
